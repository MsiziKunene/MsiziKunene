<svg viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
<!-- ===================== STYLES ===================== -->
  <style> @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap'); 
    .terminal { font-family: "Fira Code", monospace; font-size: 21px; fill: #e2e8f0; } 
    /* Gradient neon background */ .bg { fill: url(#grad1); }
    /* glowing cursor */ .cursor { fill: #4dfcff; filter: drop-shadow(0 0 8px #4dfcff); } 
    /* mask movement for typing */ @keyframes moveCursor { from { x: 40; } to { x: 1040; } } 
  </style> 
  <!-- ===================== BACKGROUND GRADIENT ===================== -->
  <defs> <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"> 
    <stop offset="0%" stop-color="#0a0f24"/> <stop offset="50%" stop-color="#0f2742"/> 
    <stop offset="100%" stop-color="#05152a"/> </linearGradient> </defs> 
  <!-- Background card -->
  <rect class="bg" width="1200" height="450" rx="18"/> 
  <!-- ===================== LINE 1 MASK ===================== --> 
  <clipPath id="clip1">
    <rect id="mask1" x="40" y="80" width="0" height="40">
      <animate attributeName="width" dur="3s" begin="0s" to="1100" fill="freeze"/> 
    </rect> 
  </clipPath> 
  <!-- ===================== LINE 2 MASK ===================== -->
  <clipPath id="clip2"> 
    <rect id="mask2" x="40" y="130" width="0" height="40"> 
    <animate attributeName="width" dur="3s" begin="3.3s" to="1100" fill="freeze"/> 
  </rect>
  </clipPath> 
  <!-- ===================== LINE 3 MASK ===================== --> 
  <clipPath id="clip3"> 
    <rect id="mask3" x="40" y="180" width="0" height="40">
    <animate attributeName="width" dur="3.5s" begin="6.7s" to="1100" fill="freeze"/> 
    </rect> 
  </clipPath> 
  <!-- ===================== TEXT LINES ===================== --> 
  <text x="40" y="110" class="terminal" clip-path="url(#clip1)"> Hi, My Name is Msizi, and I’m a Computer Science Graduate passionate about </text> 
  <text x="40" y="160" class="terminal" clip-path="url(#clip2)"> building secure, scalable, and intelligent systems. </text>
  <text x="40" y="210" class="terminal" clip-path="url(#clip3)"> I work with machine learning, cybersecurity, cloud technologies, and backend development. </text> 
  <!-- ===================== MOVING CURSOR ===================== -->
<text id="cursor1" y="210" class="terminal cursor">|
<animate attributeName="x" begin="0s" dur="3s" from="40" to="40" fill="freeze"/>
</text>

<text id="cursor2" y="210" class="terminal cursor">|
<animate attributeName="x" begin="3s" dur="3.3s" from="40" to="40" fill="freeze"/>
</text>

<text id="cursor3" y="210" class="terminal cursor">|
<animate attributeName="x" begin="6.4s" dur="3.5s" from="40" to="40" fill="freeze"/>
</text>

<!-- You can adjust cursor movement by calculating character width → x positions --> <!-- ===================== GITHUB STATS AREA ===================== --> <!-- Card background --> <rect x="40" y="260" width="1120" height="160" rx="14" fill="#0f1b33" opacity="0.8"/> <!-- Placeholder text (replace with images or real data) -->

<text x="60" y="300" class="terminal" fill="#38bdf8">GitHub Stats:</text>

<text x="60" y="335" class="terminal"> 
  • Total Contributions: 0000
</text>
<text x="60" y="365" class="terminal">
  • Top Languages: Java, Python, Dart, JavaScript 
</text> 
<text x="60" y="395" class="terminal"> 
  • Repositories: 00 public | 00 private
</text>
</svg>
