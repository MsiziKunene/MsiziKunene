<svg viewBox="0 0 1100 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: "Courier New", monospace;
      font-size: 20px;
      fill: #ffffff;
    }

    .bg {
      fill: #0f172a;
    }

    /* cursor */
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* typing animation */
    @keyframes typing {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1100" height="200" rx="15"/>

  <!-- Line 1 -->
  <text x="40" y="70" class="text">
    <tspan>
      Hi, My Name is Msizi, and I’m a Computer Science Graduate passionate about
      <animate attributeName="stroke-dashoffset" begin="0s"
               dur="4s" values="1000;0" fill="freeze" />
    </tspan>
  </text>

  <!-- Line 2 -->
  <text x="40" y="110" class="text">
    <tspan>
      building secure, scalable, and intelligent systems.
      <animate attributeName="stroke-dashoffset" begin="4.2s"
               dur="3s" values="1000;0" fill="freeze" />
    </tspan>
  </text>

  <!-- Line 3 -->
  <text x="40" y="150" class="text">
    <tspan>
      I work with ML, cybersecurity, cloud technologies, and backend development.
      <animate attributeName="stroke-dashoffset" begin="7.4s"
               dur="3.5s" values="1000;0" fill="freeze" />
    </tspan>
  </text>

  <!-- Blinking cursor -->
  <text x="40" y="150" class="text" opacity="1">
    <tspan id="cursor">|</tspan>
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1s"
             repeatCount="indefinite"
             begin="11s"/>
  </text>

</svg>
